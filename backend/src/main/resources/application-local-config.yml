# Authoritative configuration is a private JSON file. ORM tables are volatile only.
spring:
  datasource:
    url: jdbc:h2:mem:application_config;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
app:
  local-configuration:
    enabled: true
    file: ${APPLICATION_CONFIGURATION_FILE:./local-config/application-state.json}
  business-database:
    connected: false
  svfe:
    enabled: false
  scheduling:
    enabled: false
